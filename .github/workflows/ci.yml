name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  edge-function:
    name: Type-check Edge Function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Runs from the function folder so its deno.json applies (Deno manages the
      # npm packages itself instead of looking for the website's node_modules)
      - run: deno check index.ts
        working-directory: supabase/functions/n8n-proxy
